name: Bootstrap Loyumi release

on:
  push:
    branches:
      - agent/loyumi-masterpiece
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/loyumi-masterpiece
          fetch-depth: 0

      - name: Verify and reconstruct tested source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/loyumi-source.tar.gz.b64
          echo "2410339f7bf2aa5bc27d9c84f4446b0bbbe724c3ed3d6b7786c1313ed5a06cdb  /tmp/loyumi-source.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/loyumi-source.tar.gz.b64 > /tmp/loyumi-source.tar.gz
          echo "6acda8090a4864158251ebf1a9d169d99dba200b88ca98ee27c45013ef440cca  /tmp/loyumi-source.tar.gz" | sha256sum --check --strict

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          rm -rf .github
          tar -xzf /tmp/loyumi-source.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit reconstructed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Loyumi Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build flagship Loyumi website and preserve original guide"
          git push origin HEAD:agent/loyumi-masterpiece
